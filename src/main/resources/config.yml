# ===================================================
#   KlanEklentisi - Genel Ayarlar
#   Bu dosyayı düzenledikten sonra /klanyonetim yenile
#   komutuyla ayarları sunucuyu yeniden başlatmadan
#   uygulayabilirsiniz.
# ===================================================

genel:
  # Klan isimlerinin minimum ve maksimum uzunluğu
  min-isim-uzunlugu: 3
  maks-isim-uzunlugu: 16
  # Klan etiketinin (tag) minimum ve maksimum uzunluğu
  min-etiket-uzunlugu: 2
  maks-etiket-uzunlugu: 6
  # Bir oyuncu aynı anda sadece bir klanda olabilir (önerilen: true)
  tek-klan-siniri: true
  # Klan silindiğinde üssü de silinsin mi (sadece veri, dünyadaki bloklara dokunulmaz)
  silmede-us-temizle: true
  # Klan açıklamasının azami uzunluğu (renk kodu enjeksiyonunu önlemek için & ve §
  # karakterleri açıklamadan otomatik olarak temizlenir)
  maks-aciklama-uzunlugu: 100
  # Gönderilen bir klan davetinin kaç saniye sonra otomatik olarak süresi dolsun
  davet-suresi-saniye: 300

us-sistemi:
  # /klan us komutuyla ışınlanma açık mı
  aktif: true
  # Işınlanma öncesi bekleme süresi (saniye). 0 = beklemesiz
  bekleme-suresi: 3
  # Işınlanma sırasında hareket ederse iptal edilsin mi
  hareket-ederse-iptal: true

sohbet:
  # Klan sohbeti formatı - {etiket}, {rutbe}, {oyuncu}, {mesaj}
  format: "&8[&6{etiket}&8] &7{rutbe} &f{oyuncu}&8: &f{mesaj}"
  # Müttefik sohbeti formatı - klan + tüm müttefiklerin görür
  muttefik-format: "&8[&b⚔M&8] &7{rutbe} &f{oyuncu}&8: &b{mesaj}"

muttefik-rakip:
  # Bir klan en fazla kaç müttefik/rakip edinebilir (0 = sınırsız)
  maks-muttefik: 0
  maks-rakip: 0

depolama:
  # Şu an desteklenen: YAML (varsayılan, dosya bazlı)
  # İleride: SQLITE / MYSQL
  tur: YAML

istatistik:
  # KDR takibi ve öldürme ödülü sistemi genel açma/kapama
  aktif: true
  # Öldürünce katile gösterilecek küçük bildirim (K/D oranı ile)
  olum-mesaji-goster: true
  # Vault yüklüyse öldürme başına verilecek para (0 = kapalı)
  vault-para-odulu: 0
  # Öldürünce konsolda çalıştırılacak komutlar - {oyuncu} = katil, {hedef} = ölen
  # Örnek: "give {oyuncu} diamond 1"
  # DİKKAT: Buraya sadece güvenli komutlar ekleyin, bu liste oyuncu girdisi değil
  # sunucu sahibinin kendi yapılandırmasıdır ve doğrudan konsolda çalıştırılır.
  odul-komutlari: []
  # Güvenlik: Aynı klandan veya müttefik klandan biri diğerini öldürürse ödül
  # verilmesin (aksi halde iki oyuncu birbirini güvenli şekilde tekrar tekrar
  # öldürerek sınırsız ödül/para üretebilir). İstatistik yine de sayılır.
  odul-sadece-dusman-klan: true
  # /klan liderlik komutunda ve GUI'de bir sayfada kaç oyuncu gösterilsin
  sayfa-basi: 8
  # İstatistikler diske ne sıklıkla (saniye) kaydedilsin (performans için
  # her öldürmede değil, periyodik ve asenkron olarak yazılır)
  kayit-araligi-saniye: 60
